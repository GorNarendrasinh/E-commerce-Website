<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Store</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background-color: #f8f8f8;
  overflow-x: hidden;
}

/* ================= NAVBAR ================= */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  background: #fff;
  padding: 10px 15px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.logo img {
  width: 120px;
  max-width: 100%;
}

nav ul {
  display: flex;
  gap: 15px;
  list-style: none;
  flex-wrap: wrap;
}

nav ul li a {
  text-decoration: none;
  color: #333;
  padding: 6px 10px;
  font-size: 14px;
}

nav ul li a:hover {
  background: #f0f0f0;
  border-radius: 5px;
}

.cart {
  width: 28px;
  height: 28px;
}

/* ================= TITLES ================= */
.man, .women {
  background: lightpink;
  width: fit-content;
  margin: 25px auto;
  padding: 10px 15px;
  border-radius: 10px;
  text-align: center;
}

/* ================= GRID ================= */
.continer {
  max-width: 1200px;
  margin: auto;
  padding: 10px;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

/* ================= CARD ================= */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: 0.3s;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: auto;
  border-radius: 6px;
}

.card h2 {
  font-size: 15px;
  margin: 8px 0;
}

/* PRICE */
.productpriceelm {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}

.productprice {
  color: red;
  font-weight: bold;
}

.productacutleprice {
  color: gray;
  text-decoration: line-through;
}

/* STOCK */
.productstockelm {
  font-size: 13px;
  margin-bottom: 8px;
}

/* BUTTON */
.addtocartbtn {
  width: 100%;
  padding: 10px;
  background: black;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.addtocartbtn:hover {
  background: orange;
}

/* ================= FOOTER ================= */
.footer {
  background: black;
  color: white;
  padding: 30px 20px;
}

.roww {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.roww div {
  flex: 1 1 200px;
}

/* ================= RESPONSIVE ================= */

/* TABLET */
@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  nav ul {
    flex-direction: column;
    align-items: center;
  }

  .continer {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* MOBILE */
@media (max-width: 480px) {

  .continer {
    grid-template-columns: 1fr;
  }

  .man, .women {
    font-size: 16px;
  }

  nav ul li a {
    font-size: 13px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

  <div class="logo">
    <img src="static/images/logo.png">
  </div>

  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="#productpage">Product</a></li>
      <li><a href="#footers">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/account">Account</a></li>
    </ul>
  </nav>

  <img src="static/images/cart.png" class="cart">

</div>

<!-- PRODUCTS -->
<section id="productpage">

<h2 class="man">Men's Collection</h2>

<div class="continer">

<div class="card">
  <img src="static/images/man1.png.PNG">
  <h2>Denim Jacket</h2>

  <div class="productpriceelm">
    <p class="productprice">₹1499</p>
    <p class="productacutleprice">₹2999</p>
  </div>

  <div class="productstockelm">
    Stock: <b>40</b>
  </div>

  <button class="addtocartbtn">🛒 Add To Cart</button>
</div>

</div>

<!-- FOOTER -->
<section class="footer" id="footers">
  <div class="roww">
    <div><h3>Download App</h3><p>Android & iOS</p></div>
    <div><h3>About</h3><p>Online Store</p></div>
    <div><h3>Links</h3><p>Coupons | Blog | Return</p></div>
  </div>
</section>

</body>
</html>
