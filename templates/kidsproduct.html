<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Page</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
  background-color: #f8f8f8;
}

/* NAVBAR */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #fff;
  padding: 10px 20px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  flex-wrap: wrap;
}

.logo img {
  width: 130px;
  height: auto;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
}

nav ul li a {
  text-decoration: none;
  color: #333;
  font-size: 16px;
  padding: 8px 12px;
  transition: 0.3s;
}

nav ul li a:hover {
  background: #f0f0f0;
  color: #007bff;
  border-radius: 4px;
}

.cart {
  width: 30px;
  height: 30px;
}

/* CONTAINER */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 10px;
}

/* PRODUCTS GRID (MOST IMPORTANT FIX) */
.continer {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.card img {
  width: 100%;
  height: auto;
  display: block;
}

.card h2 {
  font-size: 16px;
  color: #444;
  margin: 10px 0;
}

/* PRICE */
.productpriceelm {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.productprice {
  color: red;
  font-size: 18px;
  font-weight: bold;
}

.productacutleprice {
  text-decoration: line-through;
  color: #888;
}

/* STOCK */
.productstockelm {
  font-size: 14px;
  margin-bottom: 10px;
}

/* BUTTON */
.addtocartbtn {
  background: #333;
  color: #fff;
  border: none;
  padding: 10px 15px;
  margin: 10px 0 20px;
  border-radius: 5px;
  cursor: pointer;
}

.addtocartbtn:hover {
  background: #555;
}

/* RATING */
.rating::before {
  content: "★★★★★";
  color: gold;
}

/* FOOTER */
.footer {
  background: #000;
  color: #fff;
  padding: 40px 20px;
}

.footer .container {
  max-width: 1200px;
  margin: auto;
}

.roww {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 20px;
}

.footer ul {
  list-style: none;
}

.footer ul li {
  color: #ccc;
  margin: 8px 0;
}

.footer ul li:hover {
  color: #fff;
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  nav ul {
    flex-direction: column;
    width: 100%;
  }

  .continer {
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }

  .roww {
    flex-direction: column;
    text-align: center;
  }
}

@media (max-width: 480px) {

  .logo img {
    width: 100px;
  }

  .productprice {
    font-size: 16px;
  }

  .card h2 {
    font-size: 14px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="static/images/logo.png">
  </div>

  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="#productpage">Product</a></li>
      <li><a href="#footers">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/account">Account</a></li>
    </ul>
  </nav>

  <img src="static/images/cart.png" class="cart">
</div>

<!-- PRODUCTS -->
<div class="continer">

  <div class="card">
    <img src="/static/images/kids6.jpg">
    <h2>Boys Cotton T-Shirt</h2>
    <div class="rating"></div>

    <div class="productpriceelm">
      <p class="productprice">₹499</p>
      <p class="productacutleprice">₹999</p>
    </div>

    <div class="productstockelm">
      <p>Stock: 80</p>
    </div>

    <button class="addtocartbtn">🛒 Add To Cart</button>
  </div>

  <div class="card">
    <img src="/static/images/kids7.png">
    <h2>Boys Denim Jeans</h2>
    <div class="rating"></div>

    <div class="productpriceelm">
      <p class="productprice">₹899</p>
      <p class="productacutleprice">₹1599</p>
    </div>

    <div class="productstockelm">
      <p>Stock: 60</p>
    </div>

    <button class="addtocartbtn">🛒 Add To Cart</button>
  </div>

</div>

<!-- FOOTER -->
<section class="footer" id="footers">
  <div class="container">
    <div class="roww">

      <div>
        <h3>Download App</h3>
        <p>Android & iOS</p>
      </div>

      <div>
        <h3>Links</h3>
        <ul>
          <li>Coupons</li>
          <li>Blog</li>
          <li>Return Policy</li>
        </ul>
      </div>

      <div>
        <h3>Follow</h3>
        <ul>
          <li>Facebook</li>
          <li>Instagram</li>
        </ul>
      </div>

    </div>
  </div>
</section>

<!-- JS SAME (NO CHANGE) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const addToCartButtons = document.querySelectorAll(".addtocartbtn");

  addToCartButtons.forEach((button, index) => {
    button.addEventListener("click", (e) => {
      e.preventDefault();

      const card = button.closest(".card");
      const name = card.querySelector("h2").innerText.trim();
      const price = parseFloat(card.querySelector(".productprice").innerText.replace("₹", "").trim());
      const originalPrice = parseFloat(card.querySelector(".productacutleprice").innerText.replace("₹", "").trim());

      const productData = {
        id: index + 1,
        name,
        price,
        originalPrice,
        quantity: 1
      };

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const existing = cart.find(item => item.id === productData.id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push(productData);
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      window.location.href = "/addtocart";
    });
  });
});
</script>

</body>
</html>
