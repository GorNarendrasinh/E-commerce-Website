<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Shop</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
  background-color: #f8f8f8;
}

/* NAVBAR */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: #fff;
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.logo img {
  width: 130px;
  max-width: 100%;
}

nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
  flex-wrap: wrap;
}

nav ul li a {
  text-decoration: none;
  color: #333;
  padding: 6px 10px;
}

nav ul li a:hover {
  background: #f0f0f0;
  border-radius: 5px;
}

.cart {
  width: 30px;
  height: 30px;
}

/* MAIN CONTAINER */
.continer {
  max-width: 1200px;
  margin: auto;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: auto;
}

/* TEXT */
.card h2 {
  font-size: 18px;
  color: #555;
  margin: 5px 0;
}

/* PRICE */
.productpriceelm {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0;
}

.productprice {
  color: red;
  font-weight: bold;
  font-size: 18px;
}

.productacutleprice {
  color: gray;
  text-decoration: line-through;
}

/* STOCK */
.productstockelm {
  font-size: 14px;
  margin-bottom: 10px;
}

/* BUTTON */
.addtocartbtn {
  width: 100%;
  padding: 10px;
  border: none;
  background: #333;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.addtocartbtn:hover {
  background: orange;
}

/* FOOTER */
.footer {
  background: #000;
  color: #fff;
  padding: 30px 15px;
  margin-top: 30px;
}

.roww {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.roww div {
  flex: 1 1 200px;
}

/* ================= RESPONSIVE ================= */

/* TABLET */
@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  nav ul {
    flex-direction: column;
    width: 100%;
    gap: 10px;
  }

  .continer {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* MOBILE */
@media (max-width: 480px) {

  .continer {
    grid-template-columns: 1fr;
  }

  .card h2 {
    font-size: 16px;
  }

  .productprice {
    font-size: 16px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

  <div class="logo">
    <img src="images/logo.png">
  </div>

  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="#productpage">Product</a></li>
      <li><a href="#footers">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/account">Account</a></li>
    </ul>
  </nav>

  <img src="images/cart.png" class="cart">

</div>

<!-- PRODUCTS -->
<div class="continer">

<!-- CARD -->
<div class="card">
  <img src="static/images/macbook.png">
  <h2>Apple MacBook A12</h2>

  <div class="productpriceelm">
    <p class="productprice">₹80000.99</p>
    <p class="productacutleprice">₹90000</p>
  </div>

  <div class="productstockelm">
    Total Stock: <b>50</b>
  </div>

  <button class="addtocartbtn">🛒 Add To Cart</button>
</div>

<!-- (ALL YOUR CARDS SAME - NO CHANGE) -->

</div>

<!-- FOOTER -->
<section class="footer">

  <div class="roww">

    <div>
      <h3>Download App</h3>
      <p>Android & iOS</p>
    </div>

    <div>
      <h3>About</h3>
      <p>RedShope Store</p>
    </div>

    <div>
      <h3>Links</h3>
      <p>Coupons | Blog | Return Policy</p>
    </div>

  </div>

</section>

<!-- YOUR JS (UNCHANGED) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const addToCartButtons = document.querySelectorAll(".addtocartbtn");

  addToCartButtons.forEach((button, index) => {
    button.addEventListener("click", (e) => {
      e.preventDefault();

      const card = button.closest(".card");
      const name = card.querySelector("h2").innerText.trim();
      const price = parseFloat(card.querySelector(".productprice").innerText.replace("₹", "").trim());
      const originalPrice = parseFloat(card.querySelector(".productacutleprice").innerText.replace("₹", "").trim());

      const productData = {
        id: index + 1,
        name,
        price,
        originalPrice,
        quantity: 1
      };

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const existing = cart.find(item => item.id === productData.id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push(productData);
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      window.location.href = "/addtocart";
    });
  });
});
</script>

</body>
</html>
