<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Shop</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
  background: #f8f8f8;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  flex-wrap: wrap;
}

.logo img {
  width: 130px;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 20px;
  flex-wrap: wrap;
}

nav ul li a {
  text-decoration: none;
  color: #333;
  padding: 8px 12px;
}

nav ul li a:hover {
  background: #eee;
  border-radius: 5px;
}

.cart {
  width: 30px;
  height: 30px;
}

/* PRODUCTS GRID (MAIN FIX) */
.continer {
  max-width: 1200px;
  margin: auto;
  padding: 20px;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: auto;
}

.card h2 {
  font-size: 16px;
  margin: 10px 0;
  color: #444;
}

/* PRICE */
.productpriceelm {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.productprice {
  color: red;
  font-weight: bold;
}

.productacutleprice {
  text-decoration: line-through;
  color: #888;
}

/* STOCK */
.productstockelm {
  font-size: 14px;
  margin-bottom: 10px;
}

/* BUTTON */
.addtocartbtn {
  background: #333;
  color: white;
  border: none;
  padding: 10px 15px;
  margin: 10px 0 20px;
  border-radius: 5px;
  cursor: pointer;
}

.addtocartbtn:hover {
  background: #555;
}

/* FOOTER */
.footer {
  background: black;
  color: white;
  padding: 40px 20px;
}

.footer .container {
  max-width: 1200px;
  margin: auto;
}

.roww {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .navbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  nav ul {
    flex-direction: column;
    width: 100%;
  }

  .continer {
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    padding: 10px;
  }

  .roww {
    flex-direction: column;
    text-align: center;
  }

  .logo img {
    width: 100px;
  }
}

@media (max-width: 480px) {
  .card h2 {
    font-size: 14px;
  }

  .productprice {
    font-size: 14px;
  }

  .addtocartbtn {
    font-size: 12px;
    padding: 8px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="static/images/logo.png">
  </div>

  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="#productpage">Product</a></li>
      <li><a href="#footers">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/account">Account</a></li>
    </ul>
  </nav>

  <img src="static/images/cart.png" class="cart">
</div>

<!-- PRODUCTS -->
<div class="continer">

  <div class="card">
    <img src="static/images/toys.jpg">
    <h2>Off-Road Monster Jeep</h2>

    <div class="productpriceelm">
      <p class="productprice">₹1999</p>
      <p class="productacutleprice">₹3999</p>
    </div>

    <div class="productstockelm">
      <p>Stock: 50</p>
    </div>

    <button class="addtocartbtn">🛒 Add To Cart</button>
  </div>

  <div class="card">
    <img src="static/images/toys2.jpg">
    <h2>Classic SUV Toy Car</h2>

    <div class="productpriceelm">
      <p class="productprice">₹788</p>
      <p class="productacutleprice">₹3999</p>
    </div>

    <div class="productstockelm">
      <p>Stock: 50</p>
    </div>

    <button class="addtocartbtn">🛒 Add To Cart</button>
  </div>

  <!-- SAME CARDS (NO CHANGE) -->
</div>

<!-- FOOTER -->
<section class="footer">
  <div class="container">
    <div class="roww">

      <div>
        <h3>App</h3>
        <p>Download our app</p>
      </div>

      <div>
        <h3>Links</h3>
        <p>Coupons | Blog | Return Policy</p>
      </div>

      <div>
        <h3>Follow</h3>
        <p>Instagram | Facebook</p>
      </div>

    </div>
  </div>
</section>

<!-- JS (SAME - NO CHANGE) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const addToCartButtons = document.querySelectorAll(".addtocartbtn");

  addToCartButtons.forEach((button, index) => {
    button.addEventListener("click", (e) => {
      e.preventDefault();

      const card = button.closest(".card");
      const name = card.querySelector("h2").innerText.trim();
      const price = parseFloat(card.querySelector(".productprice").innerText.replace("₹", "").trim());
      const originalPrice = parseFloat(card.querySelector(".productacutleprice").innerText.replace("₹", "").trim());

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      cart.push({
        id: index + 1,
        name,
        price,
        originalPrice,
        quantity: 1
      });

      localStorage.setItem("cart", JSON.stringify(cart));

      window.location.href = "/addtocart";
    });
  });
});
</script>

</body>
</html>
