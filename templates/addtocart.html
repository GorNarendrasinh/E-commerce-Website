<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shopping Cart</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin:0; padding:20px; background:#f9f9f9; }
  h1 { text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  th, td { padding: 15px; text-align: center; border-bottom: 1px solid #ddd; }
  th { background: #007bff; color: white; }
  td img { width: 80px; height: 80px; object-fit: contain; }
  .qty-controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
  .qty-controls button { padding: 6px 12px; background: #007bff; border: none; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
  .qty-controls button:disabled { background: #aaa; cursor: not-allowed; }
  .order-section { margin-top: 20px; text-align: right; }
  #login-btn, #order-btn { padding: 12px 28px; font-size: 16px; font-weight: 600; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s ease, box-shadow 0.3s ease; }
  #login-btn { background-color: #007bff; margin-right: 10px; box-shadow: 0 4px 8px rgba(0,123,255,0.4); }
  #login-btn:hover:not(:disabled) { background-color: #0056b3; }
  #order-btn { background-color: #ff4b2b; box-shadow: 0 4px 8px rgba(255,75,43,0.4); }
  #order-btn:hover:not(:disabled) { background-color: #e84322; box-shadow: 0 6px 12px rgba(232,67,34,0.6); }
  #login-btn:disabled, #order-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; color: #888; }
</style>
</head>
<body>

<h1>Your Shopping Cart</h1>

<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Price</th>
      <th>Original</th>
      <th>Qty</th>
      <th>Final</th>
      <th>Remove</th>
    </tr>
  </thead>
  <tbody id="cart-body"></tbody>
</table>

<div class="order-section">
  <button id="login-btn">Login</button>
  <a href="/order"><button id="order-btn">Place Order</button></a>
</div>

<script>
let cartItems = [];
try {
  const storedCart = JSON.parse(localStorage.getItem("cart"));
  cartItems = Array.isArray(storedCart) ? storedCart : [];
} catch(e) {
  cartItems = [];
}

const cartBody = document.getElementById('cart-body');
const loginBtn = document.getElementById('login-btn');
const orderBtn = document.getElementById('order-btn');

// Check login status
function getLoginStatus() {
  return localStorage.getItem("isLoggedIn") === "true";
}

// Render buttons based on login status and cart
function renderButtons() {
  if(getLoginStatus()) {
    loginBtn.textContent = "Logout"; // Change button text
    orderBtn.disabled = cartItems.length === 0; 
  } else {
    loginBtn.textContent = "Login"; // Change button text
    orderBtn.disabled = true; 
  }
}

// Render cart table
function renderCart() {
  cartBody.innerHTML = '';

  if(cartItems.length === 0) {
    cartBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px;">Your cart is empty!</td></tr>';
  } else {
    cartItems.forEach(item => {
      const finalPrice = item.price * item.quantity;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><img src="${item.image}" alt="${item.name}" style="width:60px;"> ${item.name}</td>
        <td>₹${item.price.toFixed(2)}</td>
        <td>₹${item.originalPrice.toFixed(2)}</td>
        <td>
          <div class="qty-controls">
            <button onclick="updateQuantity(${item.id}, -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)">+</button>
          </div>
        </td>
        <td>₹${finalPrice.toFixed(2)}</td>
        <td><button onclick="removeItem(${item.id})">✖</button></td>
      `;
      cartBody.appendChild(tr);
    });
  }

  localStorage.setItem("cart", JSON.stringify(cartItems));
  renderButtons(); // Ensure buttons update
}

// Update quantity
function updateQuantity(id, change) {
  const item = cartItems.find(i => i.id === id);
  if(!item) return;
  const newQty = item.quantity + change;
  if(newQty < 1) return;
  item.quantity = newQty;
  renderCart();
}

// Remove item
function removeItem(id) {
  cartItems = cartItems.filter(i => i.id !== id);
  renderCart();
}

// Login/Logout button click
loginBtn.onclick = () => {
  if(getLoginStatus()) {
    // logout
    localStorage.setItem("isLoggedIn", "false");
   window.location.href = "/result";

  } else {
    // login
    localStorage.setItem("isLoggedIn", "true");
     window.location.href = "/login";
  }
  renderCart();
};

// Place order
orderBtn.onclick = () => {
  if(!getLoginStatus()) {
    alert("⚠️ Please login first to place order!");
    return;
  }
  if(cartItems.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  const previousOrders = JSON.parse(localStorage.getItem("orders")) || [];
  const orderItems = cartItems.map(item => ({
    name: item.name,
    price: item.price,
    originalPrice: item.originalPrice,
    quantity: item.quantity,
    finalPrice: (item.price * item.quantity).toFixed(2)
  }));
  previousOrders.push(...orderItems);
  localStorage.setItem("orders", JSON.stringify(previousOrders));

  alert("✅ Order placed successfully!");
  cartItems = [];
  localStorage.removeItem("cart");
  renderCart();
};

// Initial render
renderCart();
</script>

</body>
</html>
